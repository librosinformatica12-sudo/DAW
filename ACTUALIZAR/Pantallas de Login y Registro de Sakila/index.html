<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina web Pantallas de Login y Registro de Sakila</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
    <div class="container">
        <h1>Iniciar Sesión</h1>
        <br>
        <div class="panel">
            <div class="switch">
                <button id="tabLoing" class="active" onclick="showForm('login0')">Iniciar Sesión</button>
                <button id="tabRegister" onclick="showForm('register')">Registrarse</button>
            </div> 
        </div>

        <div id="loginView">
          <h2>Bienvenido de nuevo</h2>
          <p class="sub">Introduce tus datos para continuar</p>
          <form id="loginForm" onsubmit="return handleLogin(event)"></form>
          <div class="field">
            <label for="loginEmail">Correo electornico</label>
            <input id="loginEmail" type="email" autocomplete="email" required>
          </div>




          
        </div>



        <form>
            <div class="input-box">
                <input type="text" placeholder="Nombre de usuario" 
                required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Contraseña" 
                required>
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="remember-password">
                <label><input type="checkbox">Recordarme</label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="btn">Ingresar</button>

            <p class="register-link"> ¿Todavia no tienes una cuenta?<a href="#"> Regístrate</a></p>
        </form>
    </div>
    </center>
</body>
</html>
