<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html;charset=utf-8">
        <title>Apertura y Cierre de Ventanas</title>
        <script type="text/javascript">
            function inicializar(){
                document.getElementById("crear-ventana").onclick=crearNueva;
                document.getElementById("cerrar-ventana").onclick=cerrarNueva;
            }
            var nuevaVentana;
            function crearNueva() { nuevaVentana = window.open("http://www.google.es","","height=400,width=800"); }
            function cerrarNueva() { if (nuevaVentana) { nuevaVentana.close(); nuevaVentana = null; } }
        </script>
    </head>
    <body onload="inicializar()">
        <button id="crear-ventana">Abrir Ventana</button>
        <button id="cerrar-ventana">Cerrar Ventana</button>
    </body>
</html>
