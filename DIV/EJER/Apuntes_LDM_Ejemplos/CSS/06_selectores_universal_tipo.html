<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selector universal y de tipo</title>
    <style type="text/css">
        /* Selector universal: todos los elementos de la página */
        * {
            margin: 10px;
        }

        /* Selector de tipo: elementos cuya etiqueta coincide */
        p {
            font-family: Verdana;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Tipos de selectores</h1>
    <p>Este párrafo usa el selector de tipo p.</p>
    <p>Este otro párrafo también.</p>
    <span>Un span al que solo afecta el selector universal.</span>
</body>
</html>
