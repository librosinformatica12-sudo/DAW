<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>@font-face</title>
    <style type="text/css">
        @font-face {
            font-family: "MysteryQuest-Regular";
            src: url("./fuentes/MysteryQuest-Regular.ttf");
        }

        body {
            font-family: "MysteryQuest-Regular", 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            font-family: "MysteryQuest-Regular", cursive;
        }
    </style>
</head>
<body>
    <h1>Fuente personalizada</h1>
    <p>Este texto usa la fuente Mystery Quest cargada con @font-face.</p>
    <p>Fuente disponible en: https://fonts.google.com/specimen/Mystery+Quest</p>
</body>
</html>
