<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estilos de fuente</title>
</head>
<body>
    <h1>Estilos de Fuente</h1>
    <hr>
    <b>Negrita o bold</b><br>
    <i>Cursiva o itálica</i><br>
    <u>Subrayado</u><br>
    <big>Tamaño grande o big</big><br>
    <small>Tamaño pequeño o small</small><br>
    <tt>Teletipo</tt><br>
    <s>Tachado o strike</s><br>
    <strike>Tachado o strike</strike><br>
    <font color="red" size="4" face="Arial">Texto con font (desaprobado)</font>
</body>
</html>
