<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listas</title>
</head>
<body>
    <h2>Lenguajes de Marcas en lista ordenada &lt;ol&gt;</h2>
    <ol>
        <li>HTML</li>
        <li>XHTML</li>
        <li>XML</li>
    </ol>

    <h2>Lenguajes de Marcas en lista no ordenada &lt;ul&gt;</h2>
    <ul>
        <li>HTML</li>
        <li>XHTML</li>
        <li>XML</li>
    </ul>
</body>
</html>
