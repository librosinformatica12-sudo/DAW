<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de div y span</title>
    <style>
        div {
            border: 2px solid royalblue;
            float: right;
            padding: 10px;
        }
        div span {
            color: blue;
        }
        .bloque {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Uso de div y span</h1>

    <div>
        Página principal<br>
        Material multimedia<br>
        Autores
    </div>

    <p>Esto es un párrafo dentro de un div, y esto un <span>span dentro de un párrafo</span>.</p>
    <p>Este párrafo está fuera del div.</p>

    <div class="bloque">
        Este es otro bloque div al que se le aplica la clase <span>bloque</span>.
    </div>
</body>
</html>
