<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Ejemplo XHTML</title>
</head>
<body>
    <h1>Documento XHTML</h1>
    <p>
        Todas las etiquetas están cerradas, en minúsculas y los valores de los
        atributos entre comillas.<br />
        Los elementos vacíos se cierran con <code>/&gt;</code>, como <code>&lt;br /&gt;</code>.
    </p>
    <img src="imagenes/happy.ico" alt="icono" />
</body>
</html>
