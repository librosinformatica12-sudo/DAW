<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 1: Flexbox (solución)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f4f6f9;
            color: #102a43;
        }
        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            background: #0b4f6c;
            color: #fff;
            padding: 1rem 1.5rem;
        }
        .logo {
            font-weight: 700;
            font-size: 1.2rem;
        }
        .menu {
            display: flex;
            gap: 1rem;
        }
        .menu a {
            color: #fff;
            text-decoration: none;
        }
        .menu a:hover {
            text-decoration: underline;
        }
        main { padding: 1.5rem; }
        .tarjetas {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .tarjeta {
            flex: 1 1 220px;
            background: #fff;
            border: 1px solid #d3e0e8;
            border-radius: 10px;
            padding: 1rem;
        }
        @media (max-width: 600px) {
            .barra {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <header class="barra">
        <span class="logo">Mi Web</span>
        <nav class="menu">
            <a href="#">Inicio</a>
            <a href="#">Servicios</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main>
        <h1>Práctica de Flexbox</h1>
        <p>Barra y tarjetas maquetadas con flexbox.</p>

        <section class="tarjetas">
            <article class="tarjeta">
                <h2>Diseño</h2>
                <p>Tarjeta 1: ocupa el mismo alto que las demás.</p>
            </article>
            <article class="tarjeta">
                <h2>Desarrollo</h2>
                <p>Tarjeta 2: las tres quedan en fila.</p>
            </article>
            <article class="tarjeta">
                <h2>Accesibilidad</h2>
                <p>Tarjeta 3: separadas con gap.</p>
            </article>
        </section>
    </main>
</body>
</html>
