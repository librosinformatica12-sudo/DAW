<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 4: Accesibilidad (plantilla)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f4f6f9;
            color: #102a43;
        }
        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        form {
            background: #fff;
            border: 1px solid #d3e0e8;
            border-radius: 10px;
            padding: 1.2rem;
        }
        .campo {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: .3rem;
            color: #9aa5ad; /* TODO 3: mejora el contraste */
        }
        input,
        textarea {
            width: 100%;
            padding: .5rem;
            border: 1px solid #b8c4cc;
            border-radius: 6px;
        }
        .cerrar {
            background: #0b4f6c;
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: .5rem .9rem;
            cursor: pointer;
        }

        /* TODO 3: añade un :focus visible a inputs y botones */

        /* TODO 4: revisa el contraste del texto de los labels */
    </style>
</head>
<body>
    <main>
        <h1>Formulario de contacto</h1>
        <img src="logo.png" class="logo">

        <form action="#" method="post">
            <div class="campo">
                <!-- TODO 1: asocia el label con el input (for + id) -->
                <label>Nombre</label>
                <input type="text" name="nombre">
            </div>

            <div class="campo">
                <!-- TODO 1: asocia el label con el input (for + id) -->
                <label>Email</label>
                <input type="email" name="email">
            </div>

            <div class="campo">
                <!-- TODO 1: asocia el label con el textarea (for + id) -->
                <label>Mensaje</label>
                <textarea name="mensaje" rows="4"></textarea>
            </div>

            <div class="campo">
                <input type="checkbox" name="acepto" id="acepto">
                <!-- TODO 1: asocia este label con el checkbox -->
                <label>Acepto las condiciones</label>
            </div>

            <!-- TODO 2: añade alt a la imagen y aria-label a este botón -->
            <button type="submit" class="cerrar">X</button>
        </form>
    </main>
</body>
</html>
