<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 5: Animaciones (plantilla)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f4f6f9;
            color: #102a43;
        }
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        .tarjeta {
            background: #fff;
            border: 1px solid #d3e0e8;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .boton {
            display: inline-block;
            background: #0b4f6c;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: .7rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
        }

        /* TODO 1: añade transition al .boton (background, transform)
           y un :hover que cambie el color y lo eleve con transform: translateY(-2px) */

        /* TODO 2: crea @keyframes aparecer que vaya de opacidad 0 y
           translateY(20px) a opacidad 1 y translateY(0) */

        /* TODO 3: aplica la animación a .tarjeta con animation:
           nombre duración easing */

        /* TODO 4: dentro de @media (prefers-reduced-motion: reduce),
           desactiva las animaciones y transiciones */
    </style>
</head>
<body>
    <main>
        <h1>Práctica de animaciones</h1>

        <article class="tarjeta">
            <h2>Tarjeta animada</h2>
            <p>Debe aparecer con una animación suave al cargar la página.</p>
            <button class="boton">Pasa el ratón por encima</button>
        </article>

        <article class="tarjeta">
            <h2>Otra tarjeta</h2>
            <p>Si el usuario prefiere menos movimiento, no debe animarse.</p>
        </article>
    </main>
</body>
</html>
