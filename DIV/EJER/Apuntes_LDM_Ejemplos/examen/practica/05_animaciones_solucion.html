<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 5: Animaciones (solución)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f4f6f9;
            color: #102a43;
        }
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        .tarjeta {
            background: #fff;
            border: 1px solid #d3e0e8;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            animation: aparecer .6s ease both;
        }
        .tarjeta + .tarjeta {
            animation-delay: .15s;
        }
        .boton {
            display: inline-block;
            background: #0b4f6c;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: .7rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background .25s ease, transform .25s ease;
        }
        .boton:hover {
            background: #01baef;
            color: #102a43;
            transform: translateY(-2px);
        }
        .boton:active {
            transform: translateY(0);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tarjeta,
            .boton {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Práctica de animaciones</h1>

        <article class="tarjeta">
            <h2>Tarjeta animada</h2>
            <p>Aparece con una animación suave al cargar la página.</p>
            <button class="boton">Pasa el ratón por encima</button>
        </article>

        <article class="tarjeta">
            <h2>Otra tarjeta</h2>
            <p>Si el usuario prefiere menos movimiento, no se anima.</p>
        </article>
    </main>
</body>
</html>
