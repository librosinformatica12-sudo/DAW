                explicacion: "text-decoration: underline subraya el texto."
            },
            {
                tema: "CSS · Texto",
                p: "¿Qué propiedad controla el espacio entre líneas?",
                opciones: ["letter-spacing", "line-height", "word-spacing", "text-indent"],
                correcta: 1,
                explicacion: "line-height define la altura de cada línea de texto."
            },
            {
                tema: "CSS · Fuentes",
                p: "¿Para qué sirve @font-face?",
                opciones: [
                    "Para cargar una fuente personalizada",
                    "Para cambiar el color de la fuente",
                    "Para importar una hoja de estilos",
                    "Para definir el tamaño base"
                ],
                correcta: 0,
                explicacion: "@font-face permite declarar y cargar una fuente propia."
            },
            {
                tema: "CSS · Fuentes",
                p: "¿Para qué sirve @import en CSS?",
                opciones: [
                    "Para importar una hoja de estilos externa",
                    "Para importar una fuente",
                    "Para importar imágenes",
                    "Para importar variables"
                ],
                correcta: 0,
                explicacion: "@import incorpora una hoja de estilos externa dentro de otra."
            },
            {
                tema: "DIV · Maquetación",
                p: "¿Qué propiedad activa el modelo Flexbox en un contenedor?",
                opciones: ["display: flex;", "position: flex;", "flex: 1;", "layout: flex;"],
                correcta: 0,
                explicacion: "Flexbox se activa con display: flex en el contenedor."
            },
            {
                tema: "DIV · Maquetación",
                p: "¿Qué sistema de maquetación es bidimensional (filas y columnas)?",
                opciones: ["Flexbox", "CSS Grid", "float", "inline-block"],
                correcta: 1,
                explicacion: "CSS Grid trabaja en dos dimensiones; Flexbox en una."
            },
            {
                tema: "DIV · Maquetación",
                p: "¿Cuál es la sintaxis correcta de una media query?",
                opciones: [
                    "@media (max-width: 768px) { ... }",
                    "@query max-width 768px { ... }",
                    "media(max-width: 768px) { ... }",
                    "@media = 768px { ... }"
                ],
                correcta: 0,
                explicacion: "Se escribe @media seguido de la condición entre paréntesis."
            },
            {
                tema: "DIV · Maquetación",
                p: "¿Qué etiqueta representa el contenido principal de la página?",
                opciones: ["<div>", "<main>", "<span>", "<article>"],
                correcta: 1,
                explicacion: "<main> identifica el contenido principal del documento."
            },
            {
                tema: "DIV · Maquetación",
                p: "¿Qué atributo proporciona un texto alternativo a una imagen?",
                opciones: ["src", "alt", "title", "longdesc"],
                correcta: 1,
                explicacion: "alt describe la imagen para lectores de pantalla y si no carga."
            },
            {
                tema: "DIV · Maquetación",
                p: "¿Cómo se asocia un <label> con su campo de formulario?",
                opciones: [
                    "Con el atributo name",
                    "Con for igual al id del campo",
                    "Con el atributo class",
                    "Con la etiqueta link"
                ],
                correcta: 1,
                explicacion: "El atributo for del label debe coincidir con el id del control."
            },
            {
                tema: "DIV · Maquetación",
                p: "¿Qué unidad es relativa al tamaño de fuente del elemento raíz?",
                opciones: ["px", "em", "rem", "pt"],
                correcta: 2,
                explicacion: "rem equivale al font-size del elemento raíz (html)."
            },
            {
                tema: "DIV · Maquetación",
                p: "¿Cómo se declara una variable CSS?",
                opciones: ["$nombre: valor;", "@nombre: valor;", "--nombre: valor;", "var(--nombre): valor;"],
                correcta: 2,
                explicacion: "Las variables se declaran con --nombre y se usan con var(--nombre)."
            },
            {
                tema: "DIV · Maquetación",
                p: "¿Para qué sirve prefers-reduced-motion en una media query?",
                opciones: [
                    "Para cargar imágenes más rápido",
                    "Para cambiar el idioma del documento",
                    "Para reducir animaciones si el usuario lo prefiere",
                    "Para activar el modo oscuro"
                ],
                correcta: 2,
                explicacion: "Permite respetar la preferencia de reducir movimiento del usuario."
            }
        ];

        const quiz = document.getElementById('quiz');
        const resultado = document.getElementById('resultado');

        document.getElementById('total').textContent = preguntas.length;

        function renderizar() {
            quiz.innerHTML = '';
            preguntas.forEach((q, i) => {
                const bloque = document.createElement('section');
                bloque.className = 'pregunta';
                bloque.id = 'pregunta-' + i;

                const tema = document.createElement('span');
                tema.className = 'tema';
                tema.textContent = q.tema;
                bloque.appendChild(tema);

                const titulo = document.createElement('h3');
                titulo.textContent = (i + 1) + '. ' + q.p;
                bloque.appendChild(titulo);

                q.opciones.forEach((opcion, j) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'q' + i;
                    radio.value = j;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(' ' + opcion));
                    bloque.appendChild(label);
                });

                const explicacion = document.createElement('p');
                explicacion.className = 'explicacion';
                explicacion.id = 'explicacion-' + i;
                explicacion.hidden = true;
                bloque.appendChild(explicacion);

                quiz.appendChild(bloque);
            });
            resultado.innerHTML = '';
        }

        function corregir() {
            let aciertos = 0;
            const porTema = {};

            preguntas.forEach((q, i) => {
                const bloque = document.getElementById('pregunta-' + i);
                const explicacion = document.getElementById('explicacion-' + i);
                const marcada = quiz.querySelector('input[name="q' + i + '"]:checked');
                const valor = marcada ? Number(marcada.value) : -1;

                if (!porTema[q.tema]) {
                    porTema[q.tema] = { aciertos: 0, total: 0 };
                }
                porTema[q.tema].total++;

                bloque.classList.remove('correcta', 'incorrecta');
                if (valor === q.correcta) {
                    aciertos++;
                    porTema[q.tema].aciertos++;
                    bloque.classList.add('correcta');
                } else {
                    bloque.classList.add('incorrecta');
                }

                explicacion.textContent = (valor === q.correcta ? 'Correcto. ' : 'Incorrecto. ')
                    + q.explicacion;
                explicacion.hidden = false;
            });

            const resumen = Object.keys(porTema).map((tema) =>
                '<div class="resumen-tema">' + tema + ': '
                + porTema[tema].aciertos + '/' + porTema[tema].total + '</div>'
            ).join('');

            resultado.innerHTML = '<div><strong>Resultado: ' + aciertos + ' / ' + preguntas.length
                + ' (' + Math.round((aciertos / preguntas.length) * 100) + '%)</strong></div>'
                + resumen;
        }

        document.getElementById('corregir').addEventListener('click', corregir);
        document.getElementById('reiniciar').addEventListener('click', renderizar);

        renderizar();
    </script>
</body>
</html>
