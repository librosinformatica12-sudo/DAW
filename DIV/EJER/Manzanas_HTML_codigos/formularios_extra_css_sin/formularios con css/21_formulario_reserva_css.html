<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Formulario de reserva</title>

<body>
    <h1>Reserva de cita</h1>
    <p>Completa el formulario para solicitar tu reserva.</p>

    <form action="#" method="post">
        <fieldset>
            <legend>Datos del solicitante</legend>

            <label for="nombre">Nombre y apellidos</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electrÃ³nico</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">TelÃ©fono</label>
            <input type="tel" id="telefono" name="telefono" required>
        </fieldset>

        <fieldset>
            <legend>Detalles de la reserva</legend>

            <label for="servicio">Servicio</label>
            <select id="servicio" name="servicio" required>
                <option value="">-- Selecciona un servicio --</option>
                <option value="corte">Corte de pelo</option>
                <option value="consulta">Consulta</option>
                <option value="reunion">ReuniÃ³n</option>
                <option value="otro">Otro</option>
            </select>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="hora">Hora</label>
            <input type="time" id="hora" name="hora" required>

            <label for="personas">NÃºmero de personas</label>
            <input type="number" id="personas" name="personas" min="1" max="10" value="1">

            <label for="comentarios">Comentarios adicionales</label>
            <textarea id="comentarios" name="comentarios" rows="4" cols="50"></textarea>
        </fieldset>

        <input type="submit" value="Solicitar reserva">
        <input type="reset" value="Cancelar">
    </form>

    <hr>

</body>
</html>
