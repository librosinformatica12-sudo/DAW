<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo2</title>
    <style>
        *{
            font-family: Arial, Verdena, sans-serif;
        }
        h1 {
            font-family: 'Courier New', Courier, monospace;
        }
        i {
            color: red;
        }
        b{
            color: pink;
        }
        p b {
            color: blue !important ;
        }
        b p {
            color: green;
        }
        #intro{
            font-size: 100%;
        }
        p {
            font-size: 75%;
        }
    </style>

</head>
<body>
    <h1>Quinoa</h1>
    <p id="intro">La Quinoa <i> está de moda</i>casi como el <b>aguacate</b></p>
    <div>
        <p>Esto es un párrafo &lt;p&gt;.</p>
        <ul>
            <li> Esto es un lista
                <p>Esto es un párrafo &lt;p&gt; dentro de una lista.</p>
            </li>
        </ul>
        <p>Esto es otro párrafo &lt;p&gt;.</p>
        <address>Esto no es un párrafo &lt;p&gt;, sino una dirección &lt;address&gt;</address>
    </div>
    <p>Esto es otro párrafo &lt;p&gt;.</p>
    <p>Esto es otro párrafo &lt;p&gt;.</p>
</body>
</html>
