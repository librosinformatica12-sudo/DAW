<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juego de las celdas adyacentes</title>
<style>
  :root {
    --fondo: #f3f5f9;
    --texto: #1b2333;
    --azul: #2f6fdd;
    --rojo: #e0403a;
    --boton: #1b2333;
    --boton-texto: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12161f;
      --texto: #e8ecf5;
      --azul: #3f7de8;
      --rojo: #ee5650;
      --boton: #e8ecf5;
      --boton-texto: #12161f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    background: var(--fondo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.5rem; margin: 0; text-align: center; }
  #tablero {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: min(320px, 80vw);
    aspect-ratio: 1;
  }
  .celda {
    border: none;
    border-radius: 12px;
    background: var(--azul);
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }
  .celda:active { transform: scale(0.96); }
  .celda:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
  .celda.roja { background: var(--rojo); }
  #reiniciar {
    padding: 10px 22px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: var(--boton);
    color: var(--boton-texto);
    cursor: pointer;
  }
  #reiniciar:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .celda { transition: none; }
  }
</style>
</head>
<body>
  <h1>Juego de las celdas adyacentes</h1>

  <div id="tablero" role="group" aria-label="Tablero de 2 por 2"></div>

  <button id="reiniciar" type="button">Reiniciar juego</button>

<script>
  // Tablero 2 x 2: los índices 0..3 se distribuyen así
  //   0 1
  //   2 3
  const FILAS = 2;
  const COLUMNAS = 2;

  const tablero = document.getElementById("tablero");
  const botonReinicio = document.getElementById("reiniciar");

  let celdas = [];

  function crearTablero() {
    tablero.innerHTML = "";
    celdas = [];
    for (let i = 0; i < FILAS * COLUMNAS; i++) {
      const celda = document.createElement("button");
      celda.type = "button";
      celda.className = "celda";
      celda.setAttribute("aria-label", "Celda " + (i + 1));
      celda.addEventListener("click", () => pulsar(i));
      tablero.appendChild(celda);
      celdas.push(celda);
    }
  }

  // Devuelve los índices de las celdas adyacentes (arriba, abajo, izquierda, derecha)
  function adyacentes(indice) {
    const fila = Math.floor(indice / COLUMNAS);
    const col = indice % COLUMNAS;
    const vecinos = [];
    if (fila > 0) vecinos.push(indice - COLUMNAS);
    if (fila < FILAS - 1) vecinos.push(indice + COLUMNAS);
    if (col > 0) vecinos.push(indice - 1);
    if (col < COLUMNAS - 1) vecinos.push(indice + 1);
    return vecinos;
  }

  // Al pulsar, la celda y sus adyacentes cambian de color (azul <-> rojo)
  function pulsar(indice) {
    celdas[indice].classList.toggle("roja");
    adyacentes(indice).forEach(v => celdas[v].classList.toggle("roja"));
  }

  function reiniciar() {
    crearTablero();
  }

  botonReinicio.addEventListener("click", reiniciar);
  crearTablero();
</script>
</body>
</html>
