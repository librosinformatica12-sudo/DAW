<body>

    <div class="container">
        <!-- Switch Navigation UI -->
        <div class="auth-switch">
            <button class="switch-btn active" id="btn-tab-login">Iniciar Sesión</button>
            <button class="switch-btn" id="btn-tab-register">Registrarse</button>
        </div>

        <!-- Login Form -->
        <form id="form-login" action="login_process.php" method="POST">
            <h1>Bienvenido a Sakila</h1>
            <p class="sub">Accede a tu cuenta para continuar</p>

            <div class="input-box">
                <input type="text" name="username" placeholder="Nombre de usuario o Email" required>
                <i class='bx bxs-user'></i>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Contraseña" required>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="remember-password">
                <label><input type="checkbox" name="remember"> Recordarme</label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn">Iniciar Sesión</button>

            <p class="register-link">¿Todavía no tienes una cuenta? <a href="#" id="link-to-register">Regístrate</a></p>
        </form>

        <!-- Register Form -->
        <form id="form-registro" action="register_process.php" method="POST" novalidate hidden>
            <h2>Crear cuenta</h2>
            <p class="sub">Rellena tus datos para unirte a Sakila.</p>

            <div class="campo">
                <label for="reg-nombre">Nombre completo</label>
                <input type="text" id="reg-nombre" name="nombre" autocomplete="name" placeholder="Tu nombre">
                <div class="msg"></div>
            </div>

            <div class="campo">
                <label for="reg-email">Correo electrónico</label>
                <input type="email" id="reg-email" name="email" autocomplete="email" placeholder="tu@correo.com">
                <div class="msg"></div>
            </div>

            <div class="campo">
                <label for="reg-pass">Contraseña</label>
                <div class="entrada">
                    <input type="password" id="reg-pass" name="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
                    <button type="button" class="ojo" data-para="reg-pass">Mostrar</button>
                </div>
                <div class="fuerza"><span id="barra"></span></div>
                <div class="msg"></div>
            </div>

            <div class="campo">
                <label for="reg-pass2">Repite la contraseña</label>
                <input type="password" id="reg-pass2" name="confirm_password" autocomplete="new-password" placeholder="Repite la contraseña">
                <div class="msg"></div>
            </div>

            <button type="submit" class="enviar">Crear cuenta</button>
            <div class="aviso" id="aviso-registro" role="status"></div>
            
            <p class="register-link">¿Ya tienes una cuenta? <a href="#" id="link-to-login">Inicia sesión</a></p>
        </form>
    </div>

    <script>
        // Form switching logic
        const tabLogin = document.getElementById('btn-tab-login');
        const tabRegister = document.getElementById('btn-tab-register');
        const formLogin = document.getElementById('form-login');
        const formRegistro = document.getElementById('form-registro');
        const linkToRegister = document.getElementById('link-to-register');
        const linkToLogin = document.getElementById('link-to-login');

        function showLogin() {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            formLogin.hidden = false;
            formRegistro.hidden = true;
        }

        function showRegister() {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            formRegistro.hidden = false;
            formLogin.hidden = true;
        }

        tabLogin.addEventListener('click', showLogin);
        linkToLogin.addEventListener('click', (e) => { e.preventDefault(); showLogin(); });
        
        tabRegister.addEventListener('click', showRegister);
        linkToRegister.addEventListener('click', (e) => { e.preventDefault(); showRegister(); });

        // Password visibility toggle logic
        const toggleButtons = document.querySelectorAll('.ojo');
        toggleButtons.forEach(button => {
            button.addEventListener('click', () => {
                const inputId = button.getAttribute('data-para');
                const inputField = document.getElementById(inputId);
                if (inputField.type === 'password') {
                    inputField.type = 'text';
                    button.textContent = 'Ocultar';
                } else {
                    inputField.type = 'password';
                    button.textContent = 'Mostrar';
                }
            });
        });
    </script>
</body>
