<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="brand">
      <div>
        <div class="mark">A</div>
        <h1 style="margin-top:28px;">Tu cuenta, en un solo lugar.</h1>
        <p>Guarda tus datos, retoma donde lo dejaste y accede desde cualquier dispositivo.</p>
      </div>
      <div class="foot">Los datos se guardan solo en este navegador, con fines de demostración.</div>
    </div>

    <div class="panel">
      <div class="switch">
        <button id="tabLogin" class="active" onclick="showForm('login')">Iniciar sesión</button>
        <button id="tabRegister" onclick="showForm('register')">Registrarse</button>
      </div>

      <div id="loginView">
        <h2>Bienvenido de nuevo</h2>
        <p class="sub">Introduce tus datos para continuar.</p>
        <form id="loginForm" onsubmit="return handleLogin(event)">
          <div class="field">
            <label for="loginEmail">Correo electrónico</label>
            <input id="loginEmail" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="loginPassword">Contraseña</label>
            <input id="loginPassword" type="password" autocomplete="current-password" required>
          </div>
          <div class="msg" id="loginMsg"></div>
          <button class="submit" type="submit">Entrar</button>
        </form>
      </div>

      <div id="registerView" style="display:none;">
        <h2>Crea tu cuenta</h2>
        <p class="sub">Solo toma un minuto.</p>
        <form id="registerForm" onsubmit="return handleRegister(event)">
          <div class="field">
            <label for="regName">Nombre</label>
            <input id="regName" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="regEmail">Correo electrónico</label>
            <input id="regEmail" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="regPassword">Contraseña</label>
            <input id="regPassword" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="field">
            <label for="regPassword2">Confirmar contraseña</label>
            <input id="regPassword2" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="msg" id="registerMsg"></div>
          <button class="submit" type="submit">Crear cuenta</button>
        </form>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
