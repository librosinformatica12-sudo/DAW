<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sim Forest</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js"></script>
</head>
<body>
    <div id="cabezera">
        <h1>Sim Forest</h1>
        <p>Bienvenidos a Sim Forest</p>
    </div>

    <div id="cabezera-config">
        <h2>Configuracion</h2>
        <span>Anchura del bosque M:</span>
        
        <div> 
            <input type="number" id="anchura_bosque" placeholder="M (Anchura del bosque)">
            <input type="number" id="altura_bosque" placeholder="N (Altura del bosque)">
        </div>
        <br>
        <span>Probabilidad de nacimiento de árbol</span>
        <div>
            <input type="number" id="spin_probabilidad_arbol" placeholder="aa">
            <input type="number" id="spin_probabilidad_incendio" placeholder="bb">
        </div>
        
    </div>
    
</body>
</html>
