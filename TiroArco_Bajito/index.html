<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tiro con Arco - Simple</title>
    <link rel="stylesheet" href="estilos/estilos.css">
    <script src="js/tiroarco.js" defer></script>
</head>
<body>
    <h1>Tiro con Arco (simple)</h1>

    <div id="escenario">
        <div id="diana"></div>
        <div id="flecha"></div>
        <div id="arco"></div>
    </div>

    <div id="panel">
        <button id="btn_disparar">Disparar</button>
        <button id="btn_reiniciar">Reiniciar</button>

        <p>Flechas: <span id="flechas">5</span></p>
        <p>Puntos: <span id="puntos">0</span></p>
        <p>Aciertos: <span id="aciertos">0</span> · Fallos: <span id="fallos">0</span></p>
        <p id="mensaje">Pulsa Disparar</p>
    </div>
</body>
</html>
