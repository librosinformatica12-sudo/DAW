<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro Médico - Solicitar Cita</title>
</head>
<body>

    <h2>Solicitud de Cita Médica</h2>


    <h2>Alta de doctor</h2>
    <form action="gestionar_doctores.php" method="post">
        <!-- Nª Licencia de doctor -->
        <label for="licencia_doctor">Nª Licencia:</label>
        <input type="text" id="licencia_doctor" name="licencia_doctor" maxlength="8">

        <br>

        <!-- Nombre del doctor -->
        <label for="nombre_doctor">Nombre del Doctor:</label>
        <input type="text" id="nombre_doctor" name="nombre_doctor" maxlength="50">

        <br>

        <!-- apellido del doctor -->
        <label for="apellido_doctor">Apellido del Doctor:</label>
        <input type="text" id="apellido_doctor" name="apellido_doctor" maxlength="50">

        <br>

        <button type="submit">Alta doctor</button>                

    </form>

        <br>
        <br>
        <br>



    <!-- alta del paciente -->
    <form action="gestionar_citas.php" method="post">
        <!-- Campo para el nombre del paciente -->
        <label for="paciente">Nombre del Paciente:</label><br>
        <input type="text" id="paciente" name="paciente" required><br><br>

        <!-- Selección de especialidad -->
        <label for="especialidad">Especialidad:</label><br>
        <select id="especialidad" name="especialidad" required>
            <option value="">-- Seleccione una opción --</option>
            <option value="Medicina General">Medicina General</option>
            <option value="Pediatría">Pediatría</option>
            <option value="Dermatología">Dermatología</option>
            <option value="Traumatología">Traumatología</option>
        </select><br><br>

        <!-- Campo para fecha y hora -->
        <label for="fecha_hora">Fecha y Hora de la Cita:</label><br>
        <input type="datetime-local" id="fecha_hora" name="fecha_hora" required>
        <br><br>
        <button type="submit">Reservar Cita</button>
        
        
        <!-- Doctor que atenderá -->
        <label for="n_licencia">Doctor asignado:</label><br>
        <input type="text" id="n_licencia" name="doctor_asignado">
        <br><br>
        <button type="submit">Reservar Cita</button> 
    </form>

</body>
</html>
